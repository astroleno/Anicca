# Tencent source: only the existing public ingress and loopback may connect.
server {
    listen 80;
    server_name anicca-origin.internal;
    allow 47.103.120.24;
    allow 127.0.0.1;
    deny all;

    client_max_body_size 1m;
    location = /Anicca {
        include /www/server/panel/vhost/snippets/anicca-upstream.inc;
    }
    location ^~ /Anicca/ {
        include /www/server/panel/vhost/snippets/anicca-upstream.inc;
    }
    location / { return 404; }
}
