name: Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

      - name: Build production application
        run: npm run build

  visual-dialogue:
    name: Production dialogue smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Build production application
        run: npm run build

      - name: Run production visual smoke
        id: visual-smoke
        run: DIALOGUE_SMOKE_SERVER_MODE=start npm run test:visual-dialogue

      - name: Upload successful visual evidence
        if: steps.visual-smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: dialogue-visual-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/visual-smoke/dialogue
          if-no-files-found: error
          retention-days: 14

      - name: Upload visual failure evidence
        if: failure() && steps.visual-smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: dialogue-visual-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/visual-smoke/dialogue-failure
          if-no-files-found: error
          retention-days: 14
